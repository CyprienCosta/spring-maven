name: Spring Boot CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    name: Build, Test, Sonar & Nexus
    runs-on: self-hosted
    steps:
      # 1. Checkout du code
      - name: Checkout repository
        uses: actions/checkout@v4
      # 2. Setup JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      # 3. Build + Tests
      - name: Build with Maven
        run: mvn clean verify

      # 4. Analyse SonarQube
      - name: SonarQube Analysis
        run: |
          mvn sonar:sonar \
            -Dsonar.projectKey=springboot-app \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}     

      # 5. Publier vers Nexus (uniquement sur main)
      - name: Publish to Nexus
        if: github.ref == 'refs/heads/main'
        run: |
          # Créer le fichier settings.xml avec les bons credentials
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << EOF
          <settings>
            <servers>
              <server>
                <id>nexus</id>
                <username>${{ secrets.NEXUS_USER }}</username>
                <password>${{ secrets.NEXUS_PASSWORD }}</password>
              </server>
            </servers>
            <mirrors>
              <mirror>
                <id>nexus</id>
                <mirrorOf>*</mirrorOf>
                <url>http://192.168.56.137:8081/repository/maven-public/</url>
              </mirror>
            </mirrors>
          </settings>
          EOF
          # Désactiver le décryptage des mots de passe
          mvn deploy -DskipTests -Dsettings.security=~/.m2/settings.xml
        env:
          NEXUS_USER: ${{ secrets.NEXUS_USER }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}

      # 6. Upload l'artefact JAR
      - name: Upload JAR artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: springboot-jar
          path: target/*.jar

  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: springboot-jar
          path: target

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Docker image
        run: |
          docker build -t ${{secrets.DOCKERHUB_USERNAME}}/springboot-app:latest .
          docker push ${{secrets.DOCKERHUB_USERNAME}}/springboot-app:latest
